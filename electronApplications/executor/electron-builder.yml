# FileName: electron-builder.yml
appId: com.liberrpa.executor
productName: Executor

directories:
  buildResources: build
  output: dist

asar: true

electronLanguages:
  - en-US

files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - "!**/*.map"

asarUnpack:
  - resources/**
  - node_modules/better-sqlite3/**

electronFuses:
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: resources/LiberRPA_icon_v3_color_Executor_256.ico
