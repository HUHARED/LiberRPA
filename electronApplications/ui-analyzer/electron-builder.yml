# FileName: electron-builder.yml
appId: com.liberrpa.ui-analyzer
productName: UI Analyzer

directories:
  buildResources: build
  output: dist

asar: true

electronLanguages:
  - en-US

files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  - "!**/*.map"

electronFuses:
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: resources/LiberRPA_icon_v3_color_UiAnalyzer_256.ico

# UI Analyzer currently has no native production Node module.
npmRebuild: false
