# FileName: host.rules.yml
# Query these metrics directly in Prometheus or promtool; network series keep their device label.
groups:
  - name: liberrpa-host
    rules:
      - record: liberrpa_host_cpu_percent
        expr: >-
          clamp(100 * (1 - avg by (job, instance)
          (irate(node_cpu_seconds_total{job="liberrpa-host", mode="idle"}[5m]))), 0, 100)
          and on (job, instance) (up{job="liberrpa-host"} == 1)

      - record: liberrpa_host_memory_percent
        expr: >-
          clamp(100 * (1 - node_memory_MemAvailable_bytes{job="liberrpa-host"}
          / node_memory_MemTotal_bytes{job="liberrpa-host"}), 0, 100)
          and on (job, instance) (up{job="liberrpa-host"} == 1)

      - record: liberrpa_host_network_receive_bytes_per_second
        expr: >-
          irate(node_network_receive_bytes_total{job="liberrpa-host", device!="lo"}[5m])
          and on (job, instance) (up{job="liberrpa-host"} == 1)

      - record: liberrpa_host_network_transmit_bytes_per_second
        expr: >-
          irate(node_network_transmit_bytes_total{job="liberrpa-host", device!="lo"}[5m])
          and on (job, instance) (up{job="liberrpa-host"} == 1)
