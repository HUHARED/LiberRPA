worker_processes auto;
pid /run/liberrpa/web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /run/liberrpa/web/body;
    proxy_temp_path /run/liberrpa/web/proxy;
    fastcgi_temp_path /run/liberrpa/web/fastcgi;
    uwsgi_temp_path /run/liberrpa/web/uwsgi;
    scgi_temp_path /run/liberrpa/web/scgi;

    server {
        listen 127.0.0.1:8080;
        root /app/static;
        location / {
            try_files $uri $uri/ /index.html;
        }
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location ~ /\. {
            deny all;
        }
    }
}
