[unix_http_server]
file=/run/liberrpa/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/liberrpa/supervisord.pid
childlogdir=/run/liberrpa
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/liberrpa/supervisor.sock

[eventlistener:process-events]
command=python /app/deployment/process_events.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
priority=1
autorestart=true
startsecs=1
startretries=3
buffer_size=100
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=postgres -D /data/postgres
directory=/app
user=postgres
priority=10
autorestart=false
startsecs=5
startretries=3
stopsignal=INT
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:static]
command=nginx -c /app/deployment/nginx.conf -g "daemon off;"
directory=/app
user=liberrpa
priority=20
autorestart=false
startsecs=5
startretries=3
stopsignal=QUIT
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:web]
command=python /app/deployment/runtime.py run python -m uvicorn console_project.asgi:application --host 127.0.0.1 --port 8000 --workers 1 --proxy-headers --forwarded-allow-ips 127.0.0.1 --ws websockets-sansio --ws-max-size 65536 --lifespan on --no-access-log
directory=/app
user=liberrpa
priority=30
autorestart=false
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:job-worker]
command=python /app/deployment/runtime.py run python /app/backend/manage.py run_job_worker
directory=/app
user=liberrpa
priority=30
autorestart=false
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

