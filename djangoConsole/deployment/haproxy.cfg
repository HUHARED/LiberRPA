# FileName: haproxy.cfg
# Private HTTP listener behind the deployment host's trusted HTTPS reverse proxy.
# The upstream must replace X-Forwarded-For with one verified client address.
global
    # Console reads active downloads here. Operator access can also modify tables.
    stats socket ipv4@127.0.0.1:9999 level operator

defaults
    mode http
    timeout connect 5s
    timeout http-request 10s
    timeout http-keep-alive 10s
    # These are idle timeouts, not total transfer durations. WebSocket heartbeats keep tunnels active.
    timeout client 65s
    timeout server 65s
    timeout tunnel 65s

frontend console
    bind 0.0.0.0:52100
    acl trusted_upstream src 127.0.0.1 172.30.252.1
    http-request deny deny_status 403 unless trusted_upstream
    http-request deny deny_status 400 unless { req.hdr_cnt(X-Forwarded-For) eq 1 }
    http-request deny deny_status 400 unless { req.hdr_ip(X-Forwarded-For) -m found }

    # Match decoded paths as Django does; ordinary API requests and WebSockets use no file budget.
    acl file_upload path,url_dec -m reg ^/api/(packages|clients/editor/packages|shared-files|v1/shared-files)/uploads/[0-9a-f-]{36}/chunks/[0-9]+/$ ^/api/clients/executor/file-transfers/[0-9a-f-]{36}/content/$
    acl file_download path,url_dec -m reg ^/api/(packages|clients/executor/packages)/downloads/[0-9a-f-]{36}/content/$ ^/api/(shared-files|v1/shared-files)/downloads/[0-9a-f-]{36}/$ ^/api/run-files/[0-9a-f-]{36}/$

    # Each direction shares one instance-wide budget, defaulting to 10 MiB per second.
    # Set these environment variables below the link capacity to leave room for ordinary traffic.
    filter bwlim-in file_upload limit "${CONSOLE_UPLOAD_BANDWIDTH-10m}" key int(1) table upload_rate min-size 2896
    filter bwlim-out file_download limit "${CONSOLE_DOWNLOAD_BANDWIDTH-10m}" key int(1) table download_rate min-size 2896
    http-request set-bandwidth-limit file_upload if METH_PUT file_upload
    http-request set-bandwidth-limit file_download if METH_GET file_download

    # Track HTTP streams through the proxy tail, independently of backend response completion.
    http-request track-sc0 path,url_dec,regsub(/content/$,/),field(-2,/) table download_transfers if METH_GET file_download
    http-request deny deny_status 503 if METH_GET file_download !{ sc0_tracked }

    # The host-only published port and exact trusted gateway define the forwarding boundary.
    # Do not publish this listener directly; adjust this boundary when changing deployment networking.
    http-request set-header X-Forwarded-For %[req.hdr_ip(X-Forwarded-For)]
    http-request set-header X-Forwarded-Proto https
    http-request del-header Forwarded
    use_backend console_server if { path_beg /api/ }
    default_backend console_static

backend console_static
    server static 127.0.0.1:8080

backend console_server
    server console 127.0.0.1:8000

backend upload_rate
    stick-table type integer size 1 store bytes_in_rate(1s)

backend download_rate
    stick-table type integer size 1 store bytes_out_rate(1s)

backend download_transfers
    # Active entries do not expire. Inactive entries are disposable; Console reads conn_cur only.
    stick-table type string len 36 size 10000 expire 1m store conn_cur
